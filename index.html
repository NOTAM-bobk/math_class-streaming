<!doctype html>

  <head>
    <meta charset="UTF-8" />
    <!-- Adcash Autotag. The library is loaded through our /api/adcash proxy, and
         only when that proxy really serves it do we route the library's own
         requests (format scripts, zone config, ad calls, beacons) through it
         too. A static deploy without serverless functions keeps talking to the
         Adcash hosts directly. -->
    <script>
      (function () {
        var AD_HOSTS =
          /(^|\.)(acscdn\.com|adcash\.com|rapidadexchange\.com|usrpubtrck\.com)$/i;
        var shimInstalled = false;
        var started = false;
        var usedFallback = false;

        function rewrite(url) {
          try {
            var parsed = new URL(url, window.location.href);
            if (parsed.origin === window.location.origin) {
              return parsed.pathname.indexOf("/script/") === 0
                ? "/api/adcash" + parsed.pathname + parsed.search
                : url;
            }
            if (!AD_HOSTS.test(parsed.hostname)) return url;
            return (
              "/api/adcash/" + parsed.hostname + parsed.pathname + parsed.search
            );
          } catch (error) {
            return url;
          }
        }

        function patchSrc(proto) {
          var descriptor =
            proto && Object.getOwnPropertyDescriptor(proto, "src");
          if (!descriptor || !descriptor.set) return;
          Object.defineProperty(proto, "src", {
            configurable: true,
            enumerable: descriptor.enumerable,
            get: descriptor.get,
            set: function (value) {
              descriptor.set.call(this, rewrite(value));
            },
          });
        }

        function installShim() {
          if (shimInstalled) return;
          shimInstalled = true;

          patchSrc(window.HTMLScriptElement && HTMLScriptElement.prototype);
          patchSrc(window.HTMLImageElement && HTMLImageElement.prototype);
          patchSrc(window.HTMLIFrameElement && HTMLIFrameElement.prototype);

          var setAttribute = Element.prototype.setAttribute;
          Element.prototype.setAttribute = function (name, value) {
            if (typeof value === "string" && /^(src|href)$/i.test(name)) {
              return setAttribute.call(this, name, rewrite(value));
            }
            return setAttribute.call(this, name, value);
          };

          if (window.fetch) {
            var nativeFetch = window.fetch;
            window.fetch = function (input, init) {
              return typeof input === "string"
                ? nativeFetch.call(this, rewrite(input), init)
                : nativeFetch.call(this, input, init);
            };
          }

          if (window.XMLHttpRequest) {
            var open = XMLHttpRequest.prototype.open;
            XMLHttpRequest.prototype.open = function (method, url) {
              arguments[1] = rewrite(url);
              return open.apply(this, arguments);
            };
          }

          if (navigator.sendBeacon) {
            var beacon = navigator.sendBeacon.bind(navigator);
            navigator.sendBeacon = function (url, data) {
              return beacon(rewrite(url), data);
            };
          }
        }

        function runAutoTag() {
          if (started || !window.aclib) return;
          started = true;
          window.aclib.runAutoTag({ zoneId: "pk5bgzzsjw" });
        }

        function loadDirect() {
          if (usedFallback) return;
          usedFallback = true;
          addScript("https://acscdn.com/script/aclib.js", runAutoTag);
        }

        function addScript(src, onload, onerror) {
          var script = document.createElement("script");
          script.id = "aclib";
          script.type = "text/javascript";
          script.async = true;
          script.src = src;
          script.onload = onload;
          if (onerror) script.onerror = onerror;
          document.head.appendChild(script);
        }

        // The proxy is only worth using if it actually returns the library;
        // otherwise Adcash is loaded (and left) on its own hosts.
        addScript(
          "/api/adcash/script/aclib.js",
          function () {
            if (!window.aclib) {
              loadDirect();
              return;
            }
            installShim();
            runAutoTag();
          },
          loadDirect
        );
      })();
    </script>

      // Keep the install prompt until an in-app button asks for it.
      window.__pwaInstallPrompt = null;
      window.addEventListener("beforeinstallprompt", function (event) {
        event.preventDefault();
        window.__pwaInstallPrompt = event;
        window.dispatchEvent(new Event("mcn:install-available"));
      });
      window.addEventListener("appinstalled", function () {
        window.__pwaInstallPrompt = null;
